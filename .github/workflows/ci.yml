name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AYURFLOW_DOMAIN: clinic.example
      CADDY_IMAGE: caddy:2.10.2-alpine
      APPLICATION_DATABASE_URL_FILE: /tmp/ayurflow-ci-app-dsn
      MIGRATION_DATABASE_URL_FILE: /tmp/ayurflow-ci-migrate-dsn
      AUTH_IDLE_TIMEOUT: 5m
      AUTH_ABSOLUTE_TIMEOUT: 1h
      AUTH_ATTEMPT_LIMIT: "3"
      AUTH_ATTEMPT_WINDOW: 5m
      AUTH_BLOCK_DURATION: 5m
    steps:
      - uses: actions/checkout@v7
      - name: Check pilot exposure and secret isolation
        run: |
          printf 'synthetic-ci-only' > "$APPLICATION_DATABASE_URL_FILE"
          printf 'different-synthetic-ci-only' > "$MIGRATION_DATABASE_URL_FILE"
          docker compose -f deploy/compose.pilot.yaml --profile maintenance config --format json > "$RUNNER_TEMP/pilot.json"
          node deploy/check-config.mjs "$RUNNER_TEMP/pilot.json"
      - name: Validate HTTPS proxy configuration
        run: docker run --rm -e AYURFLOW_DOMAIN -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            echo '::error::Run gofmt on the listed files.'
            exit 1
          fi
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - name: Unit tests with race detection
        run: go test -race -shuffle=on -count=1 -timeout=5m -coverprofile=coverage.out ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend
          args: --config=../.golangci.yml --timeout=5m
      - run: go build ./...
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: ayurflow_test
          POSTGRES_USER: ayurflow_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayurflow_test -d ayurflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ayurflow_test:synthetic-ci-only@127.0.0.1:5432/ayurflow_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: Test all packages against PostgreSQL
        run: go test -race -tags=integration -shuffle=on -count=1 -timeout=5m -json ./... | tee integration-results.json
      - name: Require executed integration cases and reject skipped tests
        run: node ../scripts/check-go-test-results.mjs integration-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postgres-integration-results
          path: backend/integration-results.json
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use the project's npm version
        run: npm install --global npm@10.9.8 --no-audit --no-fund
      - name: Verify frontend toolchain
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node -p 'process.versions.node')" = "$(node -p 'require("./package.json").engines.node')"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
          test "$(npm config get engine-strict)" = "true"
      - name: Install exactly the committed dependencies
        run: npm ci --no-audit --no-fund
      - run: git diff --exit-code -- package.json package-lock.json
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
