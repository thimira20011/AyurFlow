name: Clean startup and persistence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-start-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Verify clean pilot images, migrations, seeds and persistent restart
        run: node deploy/verification/smoke.mjs
      - name: Preserve redacted OPS-04 results only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-start-results
          path: .cache/ops-04/results.json
          if-no-files-found: error
