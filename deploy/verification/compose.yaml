# OPS-04 disposable fixture only; merge with deploy/compose.pilot.yaml.
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ayurflow_ops04
      POSTGRES_PASSWORD_FILE: /run/secrets/verification_database_password
      TZ: UTC
    secrets: [verification_database_password]
    volumes: [verification_postgres:/var/lib/postgresql/data]
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d ayurflow_ops04]
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    environment:
      AUTH_ALLOWED_ORIGIN: https://localhost:3444
  proxy:
    ports: !override ["127.0.0.1:3444:443"]

volumes:
  verification_postgres:
secrets:
  verification_database_password:
    file: ${VERIFICATION_DATABASE_PASSWORD_FILE:?Generated by the OPS-04 harness}
